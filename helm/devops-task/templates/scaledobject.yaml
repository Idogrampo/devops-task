{{- if .Values.keda.enabled }}
{{- if .Values.autoscaling.enabled }}
{{- fail "keda.enabled and autoscaling.enabled are mutually exclusive: KEDA creates its own HPA" }}
{{- end }}
{{- $ns := .Release.Namespace }}
{{- $server := .Values.keda.prometheus.serverAddress }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "sample-nodejs.fullname" . }}
  labels:
    {{- include "sample-nodejs.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "sample-nodejs.fullname" . }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  # The HPA behind this object follows whichever trigger asks for the most replicas
  triggers:
    {{- with .Values.keda.cpu }}
    {{- if .enabled }}
    # Needs metrics-server. Measured on the app container only, so a sidecar does not skew it.
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .utilization | quote }}
        containerName: {{ $.Chart.Name }}
    {{- end }}
    {{- end }}
    {{- with .Values.keda.memory }}
    {{- if .enabled }}
    - type: memory
      metricType: Utilization
      metadata:
        value: {{ .utilization | quote }}
        containerName: {{ $.Chart.Name }}
    {{- end }}
    {{- end }}
    {{- with .Values.keda.requestRate }}
    {{- if .enabled }}
    # Total request rate, divided across replicas (AverageValue)
    - type: prometheus
      metadata:
        serverAddress: {{ $server | quote }}
        query: {{ .query | default (printf "sum(rate(root_access_total{namespace=%q}[1m]))" $ns) | quote }}
        threshold: {{ .threshold | quote }}
    {{- end }}
    {{- end }}
    {{- with .Values.keda.istioLatency }}
    {{- if .enabled }}
    {{- $sel := printf "reporter=%q,source_workload=%q,destination_workload_namespace=%q,destination_service_name=%q" "destination" "istio-ingressgateway" $ns (include "sample-nodejs.fullname" $) }}
    # p95 latency of user traffic (requests that arrive through the ingress gateway) as measured by Istio.
    # Prometheus scrapes and probes are excluded, and the value only counts above 1 req/s so a handful of
    # requests cannot move it. Latency does not add up across pods, so the raw value is compared to the
    # threshold (metricType: Value). Needs the sidecar and the Envoy PodMonitor.
    - type: prometheus
      metricType: Value
      metadata:
        serverAddress: {{ $server | quote }}
        query: {{ .query | default (printf "(histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{%s}[1m])) by (le)) and on() (sum(rate(istio_requests_total{%s}[1m])) > 1)) or vector(0)" $sel $sel) | quote }}
        threshold: {{ .thresholdMs | quote }}
    {{- end }}
    {{- end }}
{{- end }}
