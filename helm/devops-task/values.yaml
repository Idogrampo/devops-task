replicaCount: 2

image:
  repository: grampo/devops-task
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}

# App listens on $PORT (default 8080)
containerPort: 8080

# Non-sensitive env vars, rendered into a ConfigMap
config:
  NODE_ENV: production

# Sensitive env vars, rendered into a Secret (the app needs none today).
# Prefer existingSecret in real environments.
secret:
  existingSecret: ""
  data: {}

service:
  type: ClusterIP
  port: 80

# Default entrypoint: an Istio VirtualService bound to a platform-owned Gateway.
# Only the public app routes are exposed; /metrics and /classified stay cluster-internal.
virtualService:
  enabled: true
  gateways:
    - istio-ingress/devops-gateway
  hosts:
    - devops-task.localhost
  paths:
    - /my-app
    - /about

# Alternative for clusters without Istio (off by default)
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: devops-task.localhost
      paths:
        - path: /my-app
          pathType: Prefix
        - path: /about
          pathType: Prefix
  tls: []

probes:
  liveness:
    path: /live
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    path: /live
    periodSeconds: 3
    failureThreshold: 20

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Scrape annotations for Prometheus
metrics:
  scrape: true
  path: /metrics

# Needs the Prometheus Operator CRDs (kube-prometheus-stack); off by default
monitoring:
  serviceMonitor:
    enabled: false
    interval: 15s

# Event-driven autoscaling with KEDA: scales on the request rate Prometheus sees for this release.
# Needs KEDA and Prometheus in the cluster; off by default. Use instead of autoscaling.enabled.
keda:
  enabled: false
  minReplicaCount: 2
  maxReplicaCount: 6
  pollingInterval: 15
  cooldownPeriod: 60
  prometheus:
    serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
    # Empty = total request rate for this release's namespace.
    # KEDA keeps replicas at ceil(value / threshold)
    query: ""
    threshold: "5"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
