# Values for the local docker-desktop environment, read by ArgoCD (argocd/application.yaml).
# CI rewrites image.tag after each image build, so Git always records what is deployed.
image:
  repository: grampo/devops-task
  tag: sha-791117a

virtualService:
  hosts:
    - devops-task.localhost

monitoring:
  serviceMonitor:
    enabled: true

keda:
  enabled: true
  istioLatency:
    enabled: true
