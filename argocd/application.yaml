# The ArgoCD Application for the app. Pulumi applies this file once to bootstrap; from then on ArgoCD
# watches this repository and syncs helm/devops-task whenever it changes (a new image tag, chart edits, ...).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-task
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Idogrampo/devops-task.git
    targetRevision: main
    path: helm/devops-task
    helm:
      valueFiles:
        - values.yaml
        - values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-task
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
