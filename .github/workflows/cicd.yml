name: CI/CD

# Trunk-based flow: PRs run every gate but publish nothing; pushes to main also
# bump the version, push the image + Helm chart to Docker Hub and tag the release.
# ArgoCD (running in the local cluster) watches this repository; the gitops job commits the new
# image tag to helm/devops-task/values-local.yaml and ArgoCD rolls it out. The OCI chart on
# Docker Hub is a versioned release artifact; the cluster does not depend on it.
#
# Only changes that can affect the artifacts trigger the pipeline (README, docs, Pulumi, monitoring
# and scripts do not). Within a run, the image is built only if its tag is not in the registry yet,
# and the chart is published only if the app or helm/ changed.
on:
  push:
    branches: [main]
    paths:
      - app.js
      - package.json
      - package-lock.json
      - Dockerfile
      - .dockerignore
      - test/**
      - helm/**
      - actions/**
      - .github/workflows/cicd.yml
  pull_request:
    paths:
      - app.js
      - package.json
      - package-lock.json
      - Dockerfile
      - .dockerignore
      - test/**
      - helm/**
      - actions/**
      - .github/workflows/cicd.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_NAMESPACE: grampo
  IMAGE_REPO: grampo/devops-task
  CHART_NAME: devops-task
  SERVICE: devops-task

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test --if-present
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm lint helm/devops-task
      - run: helm template t helm/devops-task > /dev/null

  sast:
    name: SAST (Semgrep) and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Fails the job on any ERROR-severity finding
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.99.0 \
            semgrep scan --config p/javascript --config p/nodejs --config p/dockerfile \
            --severity ERROR --error --metrics=off
      - name: npm audit (critical)
        run: npm audit --omit=dev --audit-level=critical

  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      image_tag: ${{ steps.v.outputs.image_tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # SemVer from the last vX.Y.Z tag: "BREAKING CHANGE"/"!:" -> major, "feat" -> minor, else patch.
      # PRs get a throwaway 0.0.0-pr<N> that is never published.
      - id: v
        env:
          MSG: ${{ github.event.head_commit.message }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          if   grep -qE 'BREAKING CHANGE|^[a-z]+(\(.+\))?!:' <<< "$MSG"; then major=$((major+1)); minor=0; patch=0
          elif grep -qE '^feat' <<< "$MSG"; then minor=$((minor+1)); patch=0
          else patch=$((patch+1)); fi
          version="$major.$minor.$patch"
          [ -n "$PR" ] && version="0.0.0-pr$PR"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The image tag names the last commit that touched the image inputs, so commits that only
          # change docs, the chart or infra keep pointing at the existing image.
          # Not semver-shaped on purpose: ArgoCD resolves chart versions from the same Docker Hub repo's tags.
          tag=$(git log -1 --format=%h --abbrev=7 -- app.js package.json package-lock.json Dockerfile .dockerignore)
          echo "image_tag=sha-$tag" >> "$GITHUB_OUTPUT"
          # Publish a new chart only when the image inputs or the chart itself changed
          base=""
          [ "$EVENT" = push ] && base="$BEFORE"
          [ "$EVENT" = pull_request ] && base="$PR_BASE"
          if [ -z "$base" ] || [ "${base//0/}" = "" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            publish=true
          elif git diff --name-only "$base" "$GITHUB_SHA" | grep -qE '^(app\.js|package(-lock)?\.json|Dockerfile|\.dockerignore|helm/)'; then
            publish=true
          else
            publish=false
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build-scan-push:
    name: Build, scan (Trivy) and push image
    needs: [test, sast, version]
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Image tags are immutable here: if this tag is already in the registry it was built and scanned before
      - name: Check registry
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE_REPO:${{ needs.version.outputs.image_tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build (amd64, local only)
        if: github.event_name == 'pull_request' || steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPO }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Blocks the pipeline (and so the deploy) on any fixable HIGH/CRITICAL finding
      - name: Trivy image scan
        if: github.event_name == 'pull_request' || steps.exists.outputs.exists != 'true'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --exit-code 1 --severity HIGH,CRITICAL \
            --ignore-unfixed --no-progress ${{ env.IMAGE_REPO }}:scan
      - name: Docker Hub login
        if: env.PUBLISH == 'true' && steps.exists.outputs.exists != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      # amd64 layers come from the cache above; arm64 is added so the image also runs on Apple Silicon
      - name: Push multi-arch image
        if: env.PUBLISH == 'true' && steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REPO }}:${{ needs.version.outputs.image_tag }}
          cache-from: type=gha

  chart:
    name: Package and push Helm chart
    needs: [version, build-scan-push]
    if: github.event_name != 'pull_request' && needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + release
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      # appVersion = image tag, so the chart's default image is exactly the one just pushed
      - name: Package
        run: |
          helm package helm/devops-task \
            --version "${{ needs.version.outputs.version }}" \
            --app-version "${{ needs.version.outputs.image_tag }}"
      - name: Push to Docker Hub (OCI)
        env:
          TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login registry-1.docker.io -u "$DOCKERHUB_NAMESPACE" --password-stdin
          helm push "${CHART_NAME}-${{ needs.version.outputs.version }}.tgz" "oci://registry-1.docker.io/${DOCKERHUB_NAMESPACE}"
      - name: Tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" --target "$GITHUB_SHA" \
            --title "v${{ needs.version.outputs.version }}" --generate-notes

  # GitOps: record the image tag in Git. ArgoCD watches the repository and rolls the app out from this commit.
  gitops:
    name: Update image tag in Git
    needs: [version, build-scan-push]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit the new tag
        env:
          TAG: ${{ needs.version.outputs.image_tag }}
        run: |
          f=helm/devops-task/values-local.yaml
          if grep -qE "^  tag: $TAG\$" "$f"; then echo "$TAG is already deployed in Git"; exit 0; fi
          sed -i -E "s/^  tag: .*/  tag: $TAG/" "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): image tag $TAG [skip ci]"
          # main may have moved while the image was building
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 3
          done
          exit 1

  notify:
    name: Slack
    needs: [test, sast, version, build-scan-push, gitops, chart]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if grep -qE 'failure|cancelled' <<< "$RESULTS"; then echo "status=failure" >> "$GITHUB_OUTPUT"
          else echo "status=success" >> "$GITHUB_OUTPUT"; fi
      - uses: ./actions/send_slack
        with:
          message: "${{ env.SERVICE }} ${{ needs.chart.result == 'success' && format('v{0} ({1})', needs.version.outputs.version, needs.version.outputs.image_tag) || 'checks passed, nothing to release' }}"
          environment: local (docker-desktop via ArgoCD)
          service_name: ${{ env.SERVICE }}
          status: ${{ steps.result.outputs.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
